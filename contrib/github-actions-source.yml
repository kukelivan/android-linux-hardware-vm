name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/check-source.py
      - run: python3 -m compileall -q lib scripts
      - run: ./droidvm --help
      - run: for script in scripts/*.sh; do sh -n "$script"; done
